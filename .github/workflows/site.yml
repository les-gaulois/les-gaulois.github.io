name: Données et site

on:
  schedule:
    # Toutes les heures. GitHub peut retarder les exécutions planifiées.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Une seule exécution à la fois, pour éviter les conflits sur data/.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # La branche telle qu'elle est maintenant, pas au lancement : une exécution restée en file d'attente
      # repart des données que la précédente vient de pousser, et n'entre pas en conflit avec elles.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # L'historique brut de la carte reste hors de Git. S'il est perdu, la collecte le retélécharge.
      - name: Restaurer l'historique de la carte
        uses: actions/cache/restore@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ github.run_id }}
          restore-keys: clanmap-
      # Les parties de chaque membre restent hors de Git : l'historique public les garderait pour toujours. Perdues, elles se relisent
      # en quelques passages : les fiches (players.json) comme les parties des podiums (results.json).
      - name: Restaurer les parties des membres
        uses: actions/cache/restore@v6
        with:
          path: .cache/member-games
          key: member-games-${{ github.run_id }}
          restore-keys: member-games-
      - name: Collecter les données
        run: npm run data:fetch
        env:
          # Le jeton de l'Action, qui peut écrire : la collecte ne s'en sert que pour lire l'historique du dépôt, départ des joueurs de la semaine.
          GITHUB_TOKEN: ${{ github.token }}
      # La clé suit les deux fichiers du dossier : un cache n'est jamais réécrit sous la même clé.
      - name: Conserver les parties des membres
        if: ${{ !cancelled() && hashFiles('.cache/member-games/*.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/member-games
          key: member-games-${{ hashFiles('.cache/member-games/*.json') }}
      - name: Conserver l'historique de la carte
        if: ${{ !cancelled() && hashFiles('.cache/clanmap/events.bin') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ hashFiles('.cache/clanmap/events.bin') }}
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: mise à jour automatique"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      # Une seule fois par nouveau lien : demande à Discord si le webhook existe, sans rien envoyer. Le journal dit son nom et sa date de création.
      - name: Vérifier le lien Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 1
        run: npm run discord:verifier
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Après l'enregistrement : si le robot ne peut plus pousser sur main, l'étape est sautée. Sans cela, faute de trace, la même édition repartirait à chaque passage.
      # Sans ce secret, l'étape ne fait rien. Une panne de Discord ne bloque rien : le passage suivant réessaie.
      - name: Envoyer la gazette sur Discord
        # Sur une autre branche, la trace de l'envoi ne reviendrait pas sur main, et l'édition repartirait.
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run gazette:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Même salon et même secret que la gazette, et seulement après la gazette du 9 novembre 2026. Au premier passage, les places du moment servent de départ : rien n'est envoyé.
      - name: Envoyer les alertes de place sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run alertes:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Même salon, même secret et même lancement. Un message par jour au plus, quand des membres avec pseudo passent un palier.
      - name: Envoyer les paliers franchis sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run paliers:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Même salon : un message quand le clan bat un de ses records. Au premier passage, les records du moment servent de départ.
      - name: Envoyer les alertes de record sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run records:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les messages du jour, même salon et même secret : chacun au plus une fois par jour, à partir de son heure, jamais la nuit.
      # Le bilan de la veille dès 9 h, quand la collecte a fini la journée.
      - name: Envoyer « Hier chez les Gaulois » sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run hier:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les nouveaux membres dès 12 h, après une relecture de la liste.
      - name: Envoyer la bienvenue sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run bienvenue:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les plus actifs entre deux relevés de la liste, dès 17 h.
      - name: Envoyer les plus actifs sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run actifs:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les nouveautés du site dès 19 h, en texte.
      - name: Envoyer les nouveautés du site sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run nouveautes:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # La course du soir dès 21 h : place, score et écarts au classement, points gagnés depuis la veille à 20 h.
      - name: Envoyer la course du soir sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run course:envoyer
        env:
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les données sont déjà enregistrées : un échec ici n'empêche pas de reconstruire le site, et se lit dans l'avertissement.
      - name: Noter les envois sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          for fichier in data/discord-lien.json data/gazette-envoi.json data/alertes-envoi.json data/paliers-envoi.json data/records-envoi.json data/hier-envoi.json data/bienvenue-envoi.json data/actifs-envoi.json data/nouveautes-envoi.json data/course-envoi.json; do
            if [ -f "$fichier" ]; then git add -- "$fichier"; fi
          done
          if git diff --cached --quiet; then
            echo "Aucun envoi à noter."
            exit 0
          fi
          git commit -m "data: note l'état des envois sur Discord"
          for essai in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Discord : état des envois non noté. Un message déjà envoyé (gazette, alerte, paliers, message du jour ou course du soir) repartira une fois au passage suivant, si l'enregistrement remarche."
          exit 1
      # La connexion compare chaque demande à cette liste. Sans réglages, l'étape ne s'exécute pas, et une panne n'empêche jamais le site de se publier.
      - name: Relire la liste des membres
        if: ${{ !cancelled() && vars.SUPABASE_URL != '' }}
        continue-on-error: true
        run: npm run membres:relire
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Prévient l'encadrement, sur un salon Discord privé, des demandes d'adhésion qui attendent. Ni nom ni identifiant dans le message.
      # Sans le secret DISCORD_WEBHOOK_ENCADREMENT, rien n'est envoyé. Ce qui a été annoncé est noté dans Supabase, pas dans data/.
      - name: Prévenir l'encadrement sur Discord
        if: ${{ !cancelled() && github.ref_name == 'main' && vars.SUPABASE_URL != '' }}
        continue-on-error: true
        timeout-minutes: 2
        run: npm run encadrement:prevenir
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_ENCADREMENT: ${{ secrets.DISCORD_WEBHOOK_ENCADREMENT }}

  # Lance la sauvegarde chiffrée de la semaine si elle manque : le planning de GitHub saute la plupart de ses passages,
  # le robot horaire passe toutes les heures. Règles : src/lib/sauvegarde-relance.ts. Job à part, avec le seul droit
  # Actions de GitHub (lancer une exécution, mais aussi en annuler ou en effacer une avec ses fichiers) : il ne peut pas
  # écrire dans le dépôt, et le job update-data, qui travaille sur data/, n'a pas ce droit sur les sauvegardes.
  # Sans SUPABASE_URL, le job de sauvegarde.yml est sauté : rien à lancer.
  sauvegarde-de-la-semaine:
    if: github.event_name != 'push' && github.ref_name == 'main' && vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Seul le fait que la phrase existe passe ici, jamais la phrase.
      - name: Lancer la sauvegarde si elle manque
        continue-on-error: true
        timeout-minutes: 2
        run: npm run sauvegarde:relancer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAUVEGARDE_CLE_POSEE: ${{ secrets.SAUVEGARDE_CLE != '' }}

  build:
    needs: update-data
    # Sur un push, update-data est ignoré : le site se reconstruit quand même.
    if: ${{ !cancelled() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Sans ce cache, les fiches et les podiums des joueurs écrivent « Pas de données » : le site se publie quand même.
      - name: Restaurer les parties des membres
        uses: actions/cache/restore@v6
        with:
          path: .cache/member-games
          key: member-games-${{ github.run_id }}
          restore-keys: member-games-
      - id: pages
        uses: actions/configure-pages@v6
      - name: Construire le site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Sans ces deux valeurs, la connexion n'apparaît pas et le site reste entièrement statique.
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
