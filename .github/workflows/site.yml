name: Données et site

on:
  schedule:
    # Toutes les heures. GitHub peut retarder les exécutions planifiées.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Une seule exécution à la fois, pour éviter les conflits sur data/.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # La branche telle qu'elle est maintenant, pas au lancement : une exécution restée en file d'attente
      # repart des données que la précédente vient de pousser, et n'entre pas en conflit avec elles.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # L'historique brut de la carte reste hors de Git. S'il est perdu, la collecte le retélécharge.
      - name: Restaurer l'historique de la carte
        uses: actions/cache/restore@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ github.run_id }}
          restore-keys: clanmap-
      # Les parties de chaque membre restent hors de Git : l'historique public les garderait pour toujours. Perdues, elles se relisent
      # en quelques passages : les fiches (players.json) comme les parties des podiums (results.json).
      - name: Restaurer les parties des membres
        uses: actions/cache/restore@v6
        with:
          path: .cache/member-games
          key: member-games-${{ github.run_id }}
          restore-keys: member-games-
      - name: Collecter les données
        run: npm run data:fetch
        env:
          # Le jeton de l'Action, qui peut écrire : la collecte ne s'en sert que pour lire l'historique du dépôt, départ des joueurs de la semaine.
          GITHUB_TOKEN: ${{ github.token }}
      # La clé suit les deux fichiers du dossier : un cache n'est jamais réécrit sous la même clé.
      - name: Conserver les parties des membres
        if: ${{ !cancelled() && hashFiles('.cache/member-games/*.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/member-games
          key: member-games-${{ hashFiles('.cache/member-games/*.json') }}
      # L'historique se complète à chaque passage pour la carte de l'alliance : la clé suit aussi l'heure du relevé, que le
      # build lit. Le job ranger-caches ne garde ensuite que les derniers, pour ne pas remplir l'espace des caches du dépôt.
      - name: Conserver l'historique de la carte
        if: ${{ !cancelled() && hashFiles('.cache/clanmap/events.bin') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ hashFiles('.cache/clanmap/events.bin', '.cache/clanmap/releve.json') }}
      # L'envoi des victoires (victoires.yml) enregistre aussi son état sur main, toutes les 5 minutes : un push refusé parce
      # qu'il est passé entre les deux commandes se réessaie, au lieu de faire échouer la mise à jour et la publication de l'heure.
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "data: mise à jour automatique"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Données : enregistrement impossible sur ${GITHUB_REF_NAME} après cinq essais."
          exit 1
      # Une seule fois par nouveau lien : demande à Discord si le webhook existe, sans rien envoyer. Le journal dit son nom et sa date de création.
      - name: Vérifier le lien Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 1
        run: npm run discord:verifier
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # À chaque passage, demande à Discord si le webhook de chaque salon du robot existe, sans rien poster, et note la réponse
      # pour l'espace Direction (onglet Discord) : un webhook supprimé s'y voit. Le lien réglé dans la Direction, sinon le secret.
      - name: Vérifier les salons Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 1
        run: npm run salons:verifier
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
          DISCORD_WEBHOOK_ENCADREMENT: ${{ secrets.DISCORD_WEBHOOK_ENCADREMENT }}
          DISCORD_WEBHOOK_VICTOIRES: ${{ secrets.DISCORD_WEBHOOK_VICTOIRES }}
      # Après l'enregistrement : si le robot ne peut plus pousser sur main, l'étape est sautée. Sans cela, faute de trace, la même édition repartirait à chaque passage.
      # Le lien du salon des nouvelles est celui réglé dans la Direction, sinon le secret DISCORD_WEBHOOK_GAZETTE ; sans l'un ni
      # l'autre, l'étape ne fait rien. Une panne de Discord ne bloque rien : le passage suivant réessaie.
      - name: Envoyer la gazette sur Discord
        # Sur une autre branche, la trace de l'envoi ne reviendrait pas sur main, et l'édition repartirait.
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run gazette:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Même salon et même secret que la gazette, et seulement après la gazette du 9 novembre 2026. Au premier passage, les places du moment servent de départ : rien n'est envoyé.
      - name: Envoyer les alertes de place sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run alertes:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Même salon, même secret et même lancement. Un message par jour au plus, quand des membres avec pseudo passent un palier.
      - name: Envoyer les paliers franchis sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run paliers:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Même salon : un message quand le clan bat un de ses records. Au premier passage, les records du moment servent de départ.
      - name: Envoyer les alertes de record sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run records:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les messages du jour, même salon et même secret : chacun au plus une fois par jour, de son heure à minuit.
      # Le bilan de la veille dès 9 h, quand la collecte a fini la journée.
      - name: Envoyer « Hier chez les Gaulois » sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run hier:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les nouveaux membres dès 12 h, après une relecture de la liste.
      - name: Envoyer la bienvenue sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run bienvenue:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les plus actifs entre deux relevés de la liste, dès 17 h.
      - name: Envoyer les plus actifs sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run actifs:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les nouveautés du site dès 19 h, en image.
      - name: Envoyer les nouveautés du site sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run nouveautes:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # La course du soir dès 21 h : place, score et écarts au classement, points gagnés depuis la veille à 20 h.
      - name: Envoyer la course du soir sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run course:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Jouer ensemble, une fois par semaine, dès le mardi 14 h : la part des parties à plusieurs et les duos qui ont le plus gagné ensemble.
      - name: Envoyer « Jouer ensemble » sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        timeout-minutes: 2
        run: npm run groupes:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      # Les achats du village partent du workflow victoires.yml, toutes les 5 minutes : pas d'ici, pour n'avoir qu'un seul
      # écrivain de data/achats-envoi.json.
      # Les données sont déjà enregistrées : un échec ici n'empêche pas de reconstruire le site, et se lit dans l'avertissement.
      - name: Noter les envois sur Discord
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          for fichier in data/discord-lien.json data/gazette-envoi.json data/alertes-envoi.json data/paliers-envoi.json data/records-envoi.json data/hier-envoi.json data/bienvenue-envoi.json data/actifs-envoi.json data/nouveautes-envoi.json data/course-envoi.json data/groupes-envoi.json; do
            if [ -f "$fichier" ]; then git add -- "$fichier"; fi
          done
          if git diff --cached --quiet; then
            echo "Aucun envoi à noter."
            exit 0
          fi
          git commit -m "data: note l'état des envois sur Discord"
          for essai in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Discord : état des envois non noté. Un message déjà envoyé (gazette, alerte, paliers, message du jour, course du soir, ou « Jouer ensemble ») repartira une fois au passage suivant, si l'enregistrement remarche."
          exit 1
      # La connexion compare chaque demande à cette liste. Sans réglages, l'étape ne s'exécute pas, et une panne n'empêche jamais le site de se publier.
      - name: Relire la liste des membres
        if: ${{ !cancelled() && vars.SUPABASE_URL != '' }}
        continue-on-error: true
        run: npm run membres:relire
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Verse la cagnotte des pronostics de chaque semaine entièrement relevée, d'après les victoires que le QG affiche
      # (scripts/regler-pronostics.ts). Une semaine ne se règle qu'une fois. Sans réglages, l'étape ne s'exécute pas.
      - name: Régler les pronostics de la semaine
        if: ${{ !cancelled() && github.ref_name == 'main' && vars.SUPABASE_URL != '' }}
        continue-on-error: true
        timeout-minutes: 2
        run: npm run pronostics:regler
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Prévient l'encadrement, sur un salon Discord privé, des demandes d'adhésion qui attendent. Ni nom ni identifiant dans le message.
      # Le lien réglé dans la Direction, sinon le secret DISCORD_WEBHOOK_ENCADREMENT ; sans l'un ni l'autre, rien n'est envoyé.
      # Ce qui a été annoncé est noté dans Supabase, pas dans data/.
      - name: Prévenir l'encadrement sur Discord
        if: ${{ !cancelled() && github.ref_name == 'main' && vars.SUPABASE_URL != '' }}
        continue-on-error: true
        timeout-minutes: 2
        run: npm run encadrement:prevenir
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_ENCADREMENT: ${{ secrets.DISCORD_WEBHOOK_ENCADREMENT }}

  # Les victoires partent par leur propre workflow (victoires.yml), lancé toutes les 5 minutes par la tâche « Victoires GAL » de
  # cron-job.org. Chaque passage du robot le lance aussi, en secours, une fois ses données enregistrées, pour ne pas pousser sur
  # main en même temps : sans la tâche, les victoires partent à chaque passage de la collecte. Job à part, avec le seul droit
  # Actions (lancer une exécution) : il n'écrit rien dans le dépôt.
  victoires-en-secours:
    needs: update-data
    if: ${{ !cancelled() && github.event_name != 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Lancer l'envoi des victoires
        continue-on-error: true
        run: gh workflow run victoires.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  # Le film de chaque partie du clan, victoires et défaites, pour « Revoir une partie » (demande du pilote, 15 novembre 2026 :
  # revoir les parties déjà jouées). Chaque nouvelle partie des derniers jours est rejouée avec le moteur d'OpenFront, lu sur
  # GitHub au commit de la partie, et vérifiée par les empreintes du jeu, comme les cartes de fin des victoires (victoires.yml).
  # Ce code venu d'ailleurs ne tourne que dans un conteneur Docker sans réseau, sans droits et en lecture seule : il ne peut
  # rien toucher de ce job. Le job lui-même n'a aucun secret, seulement le droit de lire le dépôt, ne garde pas le jeton de
  # GitHub après le checkout et ne partage pas le cache de npm. Les films vont dans le cache du workflow, hors de Git ; la
  # construction du site les relit avant de les publier. Une panne ne bloque rien : le site se publie avec les films d'avant.
  # Voir scripts/filmer-parties.ts.
  films:
    needs: update-data
    if: ${{ !cancelled() && github.event_name != 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # La branche telle qu'elle est maintenant : avec les sessions que la collecte vient de pousser.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Restaurer les films
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/films
          key: films-${{ github.run_id }}
          restore-keys: films-
      # Un moteur par version du jeu, construit une fois, dans un cache à part de celui des victoires (openfront-moteurs-) :
      # en rattrapant de vieilles parties, les films construisent d'anciennes versions, qui ne doivent pas chasser du cache
      # la version que le rejeu des victoires attend. Le préfixe ne commence pas par « films- », que ranger-caches trie à part.
      - name: Restaurer les moteurs du jeu
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/openfront/moteurs
          key: moteurs-films-${{ github.run_id }}
          restore-keys: moteurs-films-
      - name: Filmer les nouvelles parties
        continue-on-error: true
        timeout-minutes: 7
        run: npm run parties:filmer
      - name: Conserver les moteurs du jeu
        if: ${{ !cancelled() && hashFiles('.cache/openfront/moteurs/*.mjs') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/openfront/moteurs
          key: moteurs-films-${{ hashFiles('.cache/openfront/moteurs/*.mjs') }}
      # La clé suit l'index, qui note l'heure de chaque passage : un cache par passage, ranger-caches n'en garde que trois.
      - name: Conserver les films
        if: ${{ !cancelled() && hashFiles('.cache/films/index.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/films
          key: films-${{ hashFiles('.cache/films/index.json') }}
      # Le vrai lecteur de replay du jeu (demande du pilote, 15 novembre 2026 : « je veux reconnaître le jeu »), construit une
      # fois par version du jeu qui a joué une partie filmée, trois versions au plus. Le code du jeu est lu sur GitHub au commit ;
      # ses bibliothèques sont installées sans leurs scripts ; sa construction, qui exécute sa configuration, ne tourne que dans
      # un conteneur Node 24 sans réseau ni droits. Rien n'est exécuté ici de ce qu'elle produit : le job « lecteur » le dépose
      # sur son site à lui, à une autre adresse que celle du clan (REPLAY_SITE), où le navigateur des visiteurs le lit sous une
      # règle de sécurité qui ne laisse rien partir ailleurs. Voir scripts/construire-lecteurs.ts et src/lib/rejeu/lecteur-jeu.ts.
      - name: Restaurer les lecteurs du jeu
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/lecteurs
          key: lecteurs-${{ github.run_id }}
          restore-keys: lecteurs-
      - name: Construire les lecteurs du jeu
        if: ${{ !cancelled() && hashFiles('.cache/films/index.json') != '' }}
        continue-on-error: true
        timeout-minutes: 8
        run: npm run lecteurs:construire
      - name: Conserver les lecteurs du jeu
        if: ${{ !cancelled() && hashFiles('.cache/lecteurs/*/modele.html') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/lecteurs
          key: lecteurs-${{ hashFiles('.cache/lecteurs/*/modele.html') }}

  # Depuis le 13 novembre 2026, l'historique de la carte se garde à chaque passage (plusieurs dizaines de Mo chaque fois) :
  # seuls les trois plus récents restent, pour ne pas remplir l'espace des caches du dépôt (10 Go), où GitHub effacerait
  # sinon d'autres caches. Les films des parties (quelques dizaines de Mo) de même, depuis le 15 novembre 2026, après leur
  # job. Job à part, avec le seul droit Actions : il n'écrit rien dans le dépôt.
  ranger-caches:
    needs: [update-data, films]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Effacer les anciens historiques de la carte
        continue-on-error: true
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "refs/heads/${GITHUB_REF_NAME}" --key clanmap- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' |
            while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Effacer les anciens films des parties et leurs moteurs
        continue-on-error: true
        run: |
          for prefixe in films- moteurs-films- lecteurs-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "refs/heads/${GITHUB_REF_NAME}" --key "$prefixe" --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' |
              while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
          done
        env:
          GH_TOKEN: ${{ github.token }}

  # Lance la sauvegarde chiffrée de la semaine si elle manque : le planning de GitHub saute la plupart de ses passages,
  # le robot horaire passe toutes les heures. Règles : src/lib/sauvegarde-relance.ts. Job à part, avec le seul droit
  # Actions de GitHub (lancer une exécution, mais aussi en annuler ou en effacer une avec ses fichiers) : il ne peut pas
  # écrire dans le dépôt, et le job update-data, qui travaille sur data/, n'a pas ce droit sur les sauvegardes.
  # Sans SUPABASE_URL, le job de sauvegarde.yml est sauté : rien à lancer.
  sauvegarde-de-la-semaine:
    if: github.event_name != 'push' && github.ref_name == 'main' && vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Seul le fait que la phrase existe passe ici, jamais la phrase.
      - name: Lancer la sauvegarde si elle manque
        continue-on-error: true
        timeout-minutes: 2
        run: npm run sauvegarde:relancer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAUVEGARDE_CLE_POSEE: ${{ secrets.SAUVEGARDE_CLE != '' }}

  build:
    needs: [update-data, films]
    # Sur un push, update-data est ignoré : le site se reconstruit quand même. Il attend les films, sans en dépendre : un
    # job des films en panne ou ignoré ne retient pas le site.
    if: ${{ !cancelled() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Sans ce cache, les fiches et les podiums des joueurs écrivent « Pas de données » : le site se publie quand même.
      - name: Restaurer les parties des membres
        uses: actions/cache/restore@v6
        with:
          path: .cache/member-games
          key: member-games-${{ github.run_id }}
          restore-keys: member-games-
      # L'historique de la carte, pour son état pixel par pixel, que lit la carte de l'alliance : rejoué jusqu'au dernier
      # événement relu par le robot, avec ce qui a changé en 24 heures. Sans ce cache, la carte de l'alliance le dit, et le
      # site se publie quand même.
      - name: Restaurer l'historique de la carte
        uses: actions/cache/restore@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ github.run_id }}
          restore-keys: clanmap-
      # Les films des parties, faits par le job « films » : relus un par un, puis copiés dans public/films/ avec leur liste.
      # Sans ce cache, « Revoir une partie » le dit, et le site se publie quand même.
      - name: Restaurer les films des parties
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/films
          key: films-${{ github.run_id }}
          restore-keys: films-
      # Les vrais lecteurs du jeu, construits par le job « films » : préparés avec les fiches des parties de leur version, dans
      # .cache/site-du-lecteur/, jamais dans dist/. Sans ce cache, ou sans REPLAY_SITE, chaque partie garde son film, sans le
      # cadre du replay du jeu.
      - name: Restaurer les lecteurs du jeu
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/lecteurs
          key: lecteurs-${{ github.run_id }}
          restore-keys: lecteurs-
      - name: Publier les films des parties
        continue-on-error: true
        timeout-minutes: 3
        run: npm run films:publier
        env:
          BASE_PATH: ""
          # Sans le jeton, le lecteur ne serait pas déposé : pas de liens vers lui.
          REPLAY_SITE: ${{ secrets.REPLAY_DEPLOY_TOKEN != '' && github.ref_name == 'main' && vars.REPLAY_SITE || '' }}
      - name: Garder le site du lecteur pour son dépôt
        if: ${{ !cancelled() && vars.REPLAY_SITE != '' && hashFiles('.cache/site-du-lecteur/jeu/LISEZ-MOI.txt') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: site-du-lecteur
          path: .cache/site-du-lecteur
          include-hidden-files: true
          retention-days: 1
      - id: pages
        uses: actions/configure-pages@v6
      # Les Gaulois des membres au pseudo public, validés, qui ont créé le leur au village, pour l'image d'aperçu de leur fiche :
      # seule cette étape a la clé de service, pas la construction. Rangés par empreinte dans .cache/gaulois-fiches.json, hors
      # de Git et de dist/. Sans réglage, sans la migration ou en cas de panne, les fiches se dessinent comme avant.
      # La même étape lit la bannière que ces membres montrent, pour leur ligne de la liste des membres
      # (.cache/bannieres-membres.json, src/lib/bannieres-joueurs.ts) : sans elle, la liste s'affiche sans bannière.
      - name: Lire les Gaulois des fiches
        continue-on-error: true
        timeout-minutes: 1
        run: npm run gaulois:fiches
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Construire le site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Sans ces deux valeurs, la connexion n'apparaît pas et le site reste entièrement statique.
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [build, lecteur]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Le vrai lecteur de replay du jeu sur son site à lui (choix du pilote du 15 novembre 2026) : le dépôt GitHub Pages
  # <REPLAY_SITE> d'une organisation à part, jamais celui du clan, pour que le code du jeu ne tourne jamais là où les membres
  # ont leur connexion. Ce job n'installe ni n'exécute rien : il dépose les fichiers préparés par « build », en un seul commit
  # sans historique (les fiches de plus de quelques jours n'y restent pas), avec le jeton REPLAY_DEPLOY_TOKEN, limité à ce
  # seul dépôt. Le cadre « Replay du jeu » de /revoir montre ce dépôt : « deploy » attend ce job (sans dépendre de sa
  # réussite), pour que le lecteur soit en place quand le cadre paraît. En panne, la page voit que la fiche de la partie manque
  # et montre le film à la place, et l'Action le signale. Sans réglage, rien ne se fait et chaque partie garde son film.
  lecteur:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.REPLAY_SITE != '' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reprendre le site du lecteur
        id: site
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: site-du-lecteur
          path: site-du-lecteur
      - name: Déposer le lecteur sur son site
        if: ${{ steps.site.outcome == 'success' }}
        timeout-minutes: 8
        env:
          REPLAY_SITE: ${{ vars.REPLAY_SITE }}
          REPLAY_DEPLOY_TOKEN: ${{ secrets.REPLAY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          site="$(printf '%s' "${REPLAY_SITE#https://}" | tr 'A-Z' 'a-z')"
          site="${site%/}"
          if ! [[ "$site" =~ ^[a-z0-9-]+\.github\.io$ ]] || [ "$site" = "les-gaulois.github.io" ]; then
            echo "::warning::REPLAY_SITE doit être l'adresse d'un autre site GitHub Pages, comme gal-replay.github.io : rien n'est déposé."
            exit 0
          fi
          if [ -z "$REPLAY_DEPLOY_TOKEN" ]; then
            echo "::warning::Le secret REPLAY_DEPLOY_TOKEN manque : le lecteur du jeu n'est pas déposé sur $site."
            exit 0
          fi
          if [ ! -f site-du-lecteur/jeu/LISEZ-MOI.txt ]; then
            echo "Rien à déposer."
            exit 0
          fi
          depot="https://x-access-token:${REPLAY_DEPLOY_TOKEN}@github.com/${site%.github.io}/${site}.git"
          cd site-du-lecteur
          touch .nojekyll
          git init -q -b main
          git config user.name "Clan GAL"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Le dépôt tel qu'il est, pour n'envoyer que les fichiers nouveaux ; vide la première fois.
          git fetch -q --depth=1 "$depot" main 2>/dev/null || true
          git add .nojekyll robots.txt jeu
          git commit -q -m "Lecteur de replay d'OpenFront pour le site du clan [GAL] (passage ${GITHUB_RUN_ID})"
          git push -q --force "$depot" HEAD:main
          echo "::notice::Lecteur du jeu déposé sur https://$site/"
