name: Victoires et arrivées sur Discord

# Chaque victoire du clan dans le salon des victoires, quelques minutes après la partie (demande du pilote, 11 novembre 2026 :
# « au maximum 10 min après la victoire »). Lancé toutes les 5 minutes par la tâche « Victoires GAL » de cron-job.org, et à
# chaque passage du workflow du site, en secours : sans la tâche, les victoires partent à chaque passage de la collecte.
# Le planning de GitHub n'est pas utilisé : il saute la plupart de ses passages sur ce dépôt. Voir src/lib/victoires.ts.
#
# Le même passage remplace les messages d'arrivée du serveur Discord par une image de bienvenue (demande du pilote, 12 novembre
# 2026) : une arrivée est donc remplacée dans les 5 minutes, plus le temps du rejeu des victoires, qui passe avant (environ
# une minute). Voir src/lib/arrivees.ts.
#
# Il annonce aussi les achats du village des Gaulois (demande du pilote, 15 novembre 2026 : toutes les 5 minutes), dans le
# salon des achats réglé dans la Direction, sinon celui des nouvelles. Voir src/lib/achats-discord.ts.
on:
  workflow_dispatch:

permissions:
  contents: read

# Un seul envoi à la fois : deux envois en même temps posteraient la même victoire deux fois. Un lancement qui arrive pendant
# un envoi attend son tour.
concurrency:
  group: victoires
  cancel-in-progress: false

jobs:
  # La carte de fin de chaque victoire (demande du pilote, 15 novembre 2026 : « l'image de la map en fin game ») : chaque victoire
  # que l'envoi va annoncer est rejouée avec le moteur d'OpenFront, lu sur GitHub au commit de la partie, et vérifiée par les
  # empreintes du jeu. Ce code venu d'ailleurs ne tourne que dans un conteneur Docker sans réseau, sans droits et en lecture
  # seule : il ne peut rien toucher de ce job (ni ses actions, ni son jeton du cache). Le job lui-même n'a aucun secret, seulement
  # le droit de lire le dépôt, ne garde pas le jeton de GitHub après le checkout, et ne partage pas le cache de npm. Il ne transmet que des données (`.cache/cartes-finales/`), que l'envoi
  # vérifie avant de s'en servir. Voir scripts/rejouer-victoires.ts. Une panne ne retient aucune victoire : elle part avec la
  # vignette de la carte.
  rejouer:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # La copie en cache de l'état des envois, lue seulement : le rejeu choisit les mêmes victoires que l'envoi.
      - name: Restaurer l'état des envois
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/victoires-envoi.json
          key: victoires-envoi-${{ github.run_id }}
          restore-keys: victoires-envoi-
      # Un moteur par version du jeu, construit une fois : quelques méga-octets.
      - name: Restaurer les moteurs du jeu
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/openfront/moteurs
          key: openfront-moteurs-${{ github.run_id }}
          restore-keys: openfront-moteurs-
      - name: Rejouer les nouvelles victoires
        continue-on-error: true
        timeout-minutes: 9
        run: npm run victoires:rejouer
      - name: Conserver les moteurs du jeu
        if: ${{ !cancelled() && hashFiles('.cache/openfront/moteurs/*.mjs') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/openfront/moteurs
          key: openfront-moteurs-${{ hashFiles('.cache/openfront/moteurs/*.mjs') }}
      # Gardées un jour : le dépôt est public, ses artefacts aussi. Elles ne contiennent que des cases de carte, les équipes et
      # les identifiants en partie des joueurs, déjà publics dans la fiche de la partie, et la notice de licence du terrain
      # (LISEZ-MOI.txt : les cartes du jeu, CC BY-SA 4.0).
      - name: Transmettre les cartes de fin
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cartes-finales
          path: .cache/cartes-finales/
          retention-days: 1
          if-no-files-found: ignore

  envoyer:
    needs: rejouer
    # Sur une autre branche, la trace des envois ne reviendrait pas sur main, et les victoires repartiraient. Même si le rejeu
    # échoue : les victoires partent alors avec la vignette.
    if: ${{ !cancelled() && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    # La somme des délais des étapes, achats du village compris (15 novembre 2026).
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Les arrivées d'abord : elles n'attendent pas l'envoi des victoires. Le robot du clan lit le salon des messages système du
      # serveur Discord, poste une image de bienvenue pour chaque arrivée de moins de deux heures, puis retire le message de
      # Discord. Avec le jeton du robot (secret DISCORD_BOT_TOKEN) ; sans lui, l'étape ne fait rien. Rien n'est noté dans le
      # dépôt : le salon dit lui-même ce qui reste à faire. Une panne de Discord ne bloque rien : le passage suivant réessaie.
      # Juste après chaque image, il salue aussi le nouveau venu dans le salon général, avec quelques Gaulois du village : leurs
      # tenues se lisent au serveur du site (SUPABASE_URL, SUPABASE_SECRET_KEY) ; sans eux, l'image part sans Gaulois.
      - name: Accueillir les arrivées sur Discord
        continue-on-error: true
        timeout-minutes: 2
        run: npm run arrivees:accueillir
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Une seconde copie de l'état des envois, hors de Git : si l'enregistrement sur main échoue, les victoires déjà parties sont
      # notées quand même, et ne repartent pas toutes les 5 minutes. Le fichier ne contient que des identifiants de partie et des
      # heures de début, déjà publics, et, pour le score d'utilité, un nombre d'essais et s'il est réglé.
      - name: Restaurer l'état des envois
        uses: actions/cache/restore@v6
        with:
          path: .cache/victoires-envoi.json
          key: victoires-envoi-${{ github.run_id }}
          restore-keys: victoires-envoi-
      # Les cartes de fin du job « rejouer » : relues et vérifiées par l'envoi, jamais exécutées. Sans elles, la vignette.
      - name: Récupérer les cartes de fin
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: cartes-finales
          path: .cache/cartes-finales/
      # Le lien réglé dans la Direction, sinon le secret DISCORD_WEBHOOK_VICTOIRES ; sans l'un ni l'autre, l'étape ne fait rien.
      # Au premier passage, les victoires du moment servent de départ. Une panne de Discord ou de l'API ne bloque rien : le
      # passage suivant réessaie.
      # Une seconde après chaque victoire, le score d'utilité de ses Gaulois (demande du pilote, 17 novembre 2026), calculé sur
      # la même fiche et sur les dons notés par le rejeu. Un score qui n'est pas parti est noté dû, et retenté aux passages
      # suivants : le job « rejouer » rejoue alors la partie de nouveau. Voir src/lib/victoires-utilite.ts.
      - name: Envoyer les nouvelles victoires
        continue-on-error: true
        timeout-minutes: 6
        run: npm run victoires:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_VICTOIRES: ${{ secrets.DISCORD_WEBHOOK_VICTOIRES }}
      # Avant l'enregistrement sur main, qui peut échouer. La clé suit le contenu : un état inchangé ne crée pas de nouveau cache.
      - name: Conserver l'état des envois
        if: ${{ !cancelled() && hashFiles('.cache/victoires-envoi.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/victoires-envoi.json
          key: victoires-envoi-${{ hashFiles('.cache/victoires-envoi.json') }}
      # Le fichier est noté après chaque message accepté : même un envoi coupé en route garde ce qui est parti.
      - name: Noter les victoires envoyées
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f data/victoires-envoi.json ]; then
            echo "Aucun envoi à noter."
            exit 0
          fi
          git add -- data/victoires-envoi.json
          if git diff --cached --quiet; then
            echo "Aucun envoi à noter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: note les victoires envoyées sur Discord"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Victoires : état des envois non enregistré sur main. Sa copie gardée en cache évite de renvoyer ces victoires ; il sera de nouveau enregistré avec le prochain envoi."
          exit 1
      # Les achats du village des Gaulois (demande du pilote, 15 novembre 2026 : toutes les 5 minutes, pas chaque heure) : l'image
      # des objets reçus (boutique, pochette surprise, marché), une par Gaulois, lus au serveur (achats_du_village). Après les
      # victoires et à part d'elles : une panne ne retient jamais une image de victoire. Au premier passage, les achats d'avant
      # sont notés sans être annoncés. Même garde-fou que les victoires : une copie de l'état dans le cache du workflow.
      - name: Restaurer l'état des achats annoncés
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .cache/achats-envoi.json
          key: achats-envoi-${{ github.run_id }}
          restore-keys: achats-envoi-
      - name: Annoncer les achats du village sur Discord
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: npm run achats:envoyer
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_WEBHOOK_GAZETTE: ${{ secrets.DISCORD_WEBHOOK_GAZETTE }}
      - name: Conserver l'état des achats annoncés
        if: ${{ !cancelled() && hashFiles('.cache/achats-envoi.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/achats-envoi.json
          key: achats-envoi-${{ hashFiles('.cache/achats-envoi.json') }}
      - name: Noter les achats annoncés
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -f data/achats-envoi.json ]; then
            echo "Aucun achat à noter."
            exit 0
          fi
          git add -- data/achats-envoi.json
          if git diff --cached --quiet; then
            echo "Aucun achat à noter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: note les achats du village annoncés sur Discord"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Achats du village : état des envois non enregistré sur main. Sa copie gardée en cache évite de renvoyer ces achats ; il sera de nouveau enregistré avec le prochain envoi."
          exit 1
      # Les statères du village des Gaulois (docs/DIRECTION.md, « Le village des Gaulois ») :
      # 30 statères par point rapporté au clan, à chaque Gaulois présent dans la partie. Chaque partie du mois qui a rapporté
      # des points est relue une fois, et l'empreinte SHA-256 de chaque Gaulois présent part au serveur, qui crédite les
      # comptes validés.
      # Après l'envoi sur Discord et à part de lui : une panne du serveur ou de l'API ne retient jamais une image. Avec
      # SUPABASE_URL et SUPABASE_SECRET_KEY ; sans eux, l'étape ne fait rien. Rien n'est écrit dans le dépôt.
      - name: Donner les statères des points rapportés au clan
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: npm run stateres:crediter
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Les parties du sentier des Gaulois (docs/DIRECTION.md, « Le sentier des Gaulois ») : les parties du clan d'hier et
      # d'aujourd'hui qui n'ont pas rapporté de points sont relues une fois, et l'empreinte SHA-256 de chaque Gaulois présent
      # part au serveur, pour les missions du jour (« jouer une partie »). Le même appel ouvre le jour : ses missions, le
      # défi du clan et l'étal. Après les statères et à part d'eux : une panne ne retient ni une image ni un statère. Avec
      # SUPABASE_URL et SUPABASE_SECRET_KEY ; sans eux, l'étape ne fait rien. Rien n'est écrit dans le dépôt.
      - name: Noter les parties du sentier des Gaulois
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: npm run sentier:parties
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Le relevé vocal des Gaulois (docs/DIRECTION.md, « Le village des Gaulois ») : l'état vocal de chaque membre sur le
      # Discord du clan, relevé par le robot des arrivées (secret DISCORD_BOT_TOKEN), pour le fond de /gaulois. Les bulles que
      # Claude écrivait pour la place du village sont coupées depuis le 15 novembre 2026, avec le monde du village : l'étape
      # ne reçoit plus la clé de l'API Claude. En dernier, après les statères et à part d'eux : une panne ne retient jamais une
      # image de victoire ni les statères. Sans SUPABASE_URL, l'étape ne fait rien ; sans jeton, pas de relevé vocal.
      # Aucun identifiant n'est écrit au journal ni dans le dépôt. Voir src/lib/village/vie-releve.ts.
      - name: Relever le vocal des Gaulois
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: npm run village:vie
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
