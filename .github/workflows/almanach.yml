name: Almanach des petits moments

# L'écriture, une seule fois, des 650 petits moments du village des Gaulois (demande du pilote, 15 novembre 2026) : Claude
# Fable 5.2 les écrit par l'API Message Batches, le code les contrôle, l'Action les garde sur la branche robot/almanach.
# Voir src/lib/village/monde/almanach/ecriture.ts et scripts/almanach-ecrire.ts.
#
# Elle ne part que sur un push de la branche robot/almanach : jamais sur main, jamais à heure fixe. Ce qu'elle pousse sur
# cette branche, avec le jeton de l'Action, ne la relance pas (GitHub ne lance aucun workflow sur un push de ce jeton). Le
# site (site.yml) ne part que de main : rien de cette branche n'est publié avant d'y être fusionné.
#
# Le plafond de dépense est dans config/almanach.json : avant d'envoyer un lot, le script vérifie que son pire coût tient
# sous ce qui reste, sinon il n'envoie rien. Un lot pas fini dans le temps laissé reste noté en route dans ecriture.json :
# un nouveau push sur robot/almanach (même vide) le reprend, sans rien renvoyer ni repayer.
on:
  push:
    branches: [robot/almanach]

permissions:
  contents: read

# Un seul passage à la fois : deux passages enverraient deux fois le même lot. Un push pendant un passage attend son tour.
concurrency:
  group: almanach
  cancel-in-progress: false

jobs:
  ecrire:
    if: github.ref_name == 'robot/almanach'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La clé n'est donnée qu'au client du SDK officiel, qui ne l'envoie qu'à api.anthropic.com ; le journal ne dit que des
      # nombres, des identifiants et des raisons. Le script s'arrête de lui-même au bout de 4 h 40 en notant le lot en route.
      - name: Écrire les moments
        timeout-minutes: 300
        run: npx tsx scripts/almanach-ecrire.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Même après un échec ou un dépassement de temps : un lot noté en route doit être gardé pour être repris.
      - name: Garder les moments sur la branche
        if: always()
        run: |
          for fichier in src/lib/village/monde/almanach/moments.json src/lib/village/monde/almanach/ecriture.json; do
            if [ -f "$fichier" ]; then git add -- "$fichier"; fi
          done
          if git diff --cached --quiet; then
            echo "Rien de nouveau à garder."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "almanach: les petits moments écrits par Claude Fable 5.2"
          for essai in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Almanach : les moments n'ont pas pu être poussés sur ${GITHUB_REF_NAME}."
          exit 1
